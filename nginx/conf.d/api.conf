# ШАГ 1 (бутстрап SSL): первый раз поднимай Nginx ТОЛЬКО с блоком :80 ниже,
# чтобы Certbot мог пройти ACME-челлендж по /.well-known/acme-challenge/.
# После успешного получения сертификата раскомментируй блок :443 и
# `return 301` в HTTP-сервере, затем перезапусти Nginx.

server {
    listen 80;
    server_name api.magomedov.online;

    # Эндпоинт для Let's Encrypt (НЕ удалять — нужен для продления)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # После выпуска сертификата раскомментировать строчку ниже,
    # чтобы весь HTTP-трафик уходил на HTTPS:
    # return 301 https://$host$request_uri;

    # До выпуска сертификата временно проксируем на бэкенд по HTTP,
    # чтобы можно было проверить связку. Удалить эти location'ы после включения 301.
    location / {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}


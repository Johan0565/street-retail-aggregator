
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5434/retail_aggregator?sslmode=disable}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:myuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:mypassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Overpass API: список mirror'ов через запятую. Сервис пробует их по порядку
# с retry и exp-backoff внутри каждого.
#
# По умолчанию используем ТОЛЬКО локальный контейнер (docker-compose.dev.yml,
# сервис `overpass`, snapshot ЦФО). Публичные mirror'ы убраны намеренно:
# они медленные, нестабильные и портят UX на мобилке. Локальный отвечает
# за ~10-500 мс — если он лежит, FAILED-статус лучше, чем 30с ожидания
# публичного зеркала.
#
# Если потребуется временно поднять fallback (например, бэкенд переехал
# в окружение без локального Overpass) — переопредели OVERPASS_API_URLS
# через env, не правя файл.
overpass.api.urls=${OVERPASS_API_URLS:http://localhost:12345/api/interpreter}
overpass.api.url=${OVERPASS_API_URL:http://localhost:12345/api/interpreter}

# Persistent cache Overpass-ответов в PostgreSQL (TTL в часах).
# OSM-данные меняются медленно — 168ч (7 дней) разумный компромисс между
# свежестью и нагрузкой на публичные mirror'ы Overpass.
overpass.cache.ttl-hours=${OVERPASS_CACHE_TTL_HOURS:168}

# Снэпшот скоринга в PostgreSQL (TTL в часах). Если арендатор открыл
# карточку повторно в течение TTL — возвращаем сохранённую оценку
# мгновенно. Force-refresh параметром обходит TTL.
property.score.snapshot.ttl-hours=${PROPERTY_SCORE_TTL_HOURS:24}

openrouter.api.key=${OPENROUTER_API_KEY:}

app.upload.dir=${APP_UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=60MB

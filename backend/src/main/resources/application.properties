
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/retail_aggregator}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:myuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:mypassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Overpass API (OpenStreetMap, поиск по организациям). Бесплатно, без ключа.
# Можно подменить на собственный mirror через переменную OVERPASS_API_URL.
overpass.api.url=${OVERPASS_API_URL:https://overpass-api.de/api/interpreter}

# OpenRouter AI API
openrouter.api.key=${OPENROUTER_API_KEY:}

# Файловое хранилище (картинки помещений и аватарки)
app.upload.dir=${APP_UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=60MB
